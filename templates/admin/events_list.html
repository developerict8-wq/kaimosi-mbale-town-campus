{%extends 'admin/layout.html'%}{%block content%}<div class="head"><h1>Events</h1><a class="btn" href="/admin/events/add">+ Add Event</a></div><table><tr><th>Title</th><th>Date</th><th>Location</th><th>Actions</th></tr>{%for x in items%}<tr><td>{{x.title}}</td><td>{{x.event_date.strftime('%d %b %Y %I:%M %p') if x.event_date else ''}}</td><td>{{x.location}}</td><td><a href="/admin/events/{{x.id}}/edit">Edit</a> <form class="inline" method="post" action="/admin/events/{{x.id}}/delete"><button class="danger">Delete</button></form></td></tr>{%endfor%}</table>{%endblock%}
