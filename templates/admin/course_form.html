{% extends 'admin/layout.html' %}{% block content %}<h1>{{'Edit' if item else 'Add'}} Course</h1>
<form class="form" method="post"><div class="grid"><label>Course Name<input name="name" required value="{{item.name if item else ''}}"></label><label>Course Code<input name="code" value="{{item.code if item else ''}}"></label><label>Level<input name="level" placeholder="Certificate / Diploma / Higher Diploma" value="{{item.level if item else ''}}"></label><label>Duration<input name="duration" value="{{item.duration if item else ''}}"></label><label>Department<select name="department_id"><option value="">-- Select --</option>{% for d in departments %}<option value="{{d.id}}" {% if item and item.department_id==d.id %}selected{% endif %}>{{d.name}}</option>{% endfor %}</select></label><label class="full">Entry Requirements<textarea name="entry_requirements">{{item.entry_requirements if item else ''}}</textarea></label><label class="full">Description<textarea name="description">{{item.description if item else ''}}</textarea></label></div><button class="btn">Save Course</button></form>{% endblock %}
