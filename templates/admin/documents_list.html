{%extends 'admin/layout.html'%}{%block content%}<div class="head"><h1>Documents</h1><a class="btn" href="/admin/documents/add">+ Upload Document</a></div><table><tr><th>Title</th><th>Description</th><th>Actions</th></tr>{%for x in items%}<tr><td>{{x.title}}</td><td>{{x.description}}</td><td><a href="{{url_for('public.uploaded_file',filename=x.filename)}}">Open</a> <form class="inline" method="post" action="/admin/documents/{{x.id}}/delete"><button class="danger">Delete</button></form></td></tr>{%endfor%}</table>{%endblock%}
