{%extends 'admin/layout.html'%}{%block content%}<h1>Contact Messages</h1><table><tr><th>Date</th><th>Name</th><th>Email</th><th>Subject</th><th>Message</th><th>Actions</th></tr>{%for x in items%}<tr><td>{{x.created_at.strftime('%d %b %Y %H:%M')}}</td><td>{{x.name}}</td><td>{{x.email}}</td><td>{{x.subject}}</td><td>{{x.message}}</td><td>{%if not x.read%}<form method="post" action="/admin/messages/{{x.id}}/read"><button>Read</button></form>{%endif%}<form method="post" action="/admin/messages/{{x.id}}/delete"><button class="danger">Delete</button></form></td></tr>{%endfor%}</table>{%endblock%}
