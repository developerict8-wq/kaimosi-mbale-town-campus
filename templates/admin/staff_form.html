{%extends 'admin/layout.html'%}{%block content%}<h1>{{'Edit' if item else 'Add'}} Staff</h1><form class="form" method="post" enctype="multipart/form-data"><label>Name<input name="name" value="{{item.name if item else ''}}" required></label><label>Position<input name="position" value="{{item.position if item else ''}}"></label><label>Department<input name="department" value="{{item.department if item else ''}}"></label><label>Photo<input type="file" name="photo" accept="image/*"></label><label>Biography<textarea name="bio">{{item.bio if item else ''}}</textarea></label><button class="btn">Save</button></form>{%endblock%}
