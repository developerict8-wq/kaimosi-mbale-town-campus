{% extends 'admin/layout.html' %}{% block content %}<h1>{{'Edit' if item else 'Add'}} Announcement</h1><form class="form" method="post"><label>Title<input name="title" required value="{{item.title if item else ''}}"></label><label class="full">Content<textarea name="content" required>{{item.content if item else ''}}</textarea></label><label><input type="checkbox" name="published" {% if not item or item.published %}checked{% endif %}> Publish now</label><br><button class="btn">Save Announcement</button></form>{% endblock %}
