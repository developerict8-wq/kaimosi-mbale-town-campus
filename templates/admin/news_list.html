{%extends 'admin/layout.html'%}{%block content%}<div class="head"><h1>News</h1><a class="btn" href="/admin/news/add">+ Add News</a></div><table><tr><th>Image</th><th>Title</th><th>Published</th><th>Actions</th></tr>{%for x in items%}<tr><td>{%if x.image%}<img class="thumb" src="{{url_for('public.uploaded_file',filename=x.image)}}">{%endif%}</td><td>{{x.title}}</td><td>{{'Yes' if x.published else 'No'}}</td><td><a href="/admin/news/{{x.id}}/edit">Edit</a> <form class="inline" method="post" action="/admin/news/{{x.id}}/delete"><button class="danger">Delete</button></form></td></tr>{%endfor%}</table>{%endblock%}
