{%extends 'admin/layout.html'%}{%block content%}<h1>{{'Edit' if item else 'Add'}} Event</h1><form class="form" method="post" enctype="multipart/form-data"><label>Title<input name="title" value="{{item.title if item else ''}}" required></label><label>Description<textarea name="description">{{item.description if item else ''}}</textarea></label><label>Date & Time<input type="datetime-local" name="event_date" value="{{item.event_date.strftime('%Y-%m-%dT%H:%M') if item and item.event_date else ''}}"></label><label>Location<input name="location" value="{{item.location if item else ''}}"></label><label>Image<input type="file" name="image" accept="image/*"></label><button class="btn">Save</button></form>{%endblock%}
