{%extends 'admin/layout.html'%}{%block content%}<div class="head"><h1>Staff</h1><a class="btn" href="/admin/staff/add">+ Add Staff</a></div><table><tr><th>Photo</th><th>Name</th><th>Position</th><th>Department</th><th>Actions</th></tr>{%for x in items%}<tr><td>{%if x.photo%}<img class="thumb" src="{{url_for('public.uploaded_file',filename=x.photo)}}">{%endif%}</td><td>{{x.name}}</td><td>{{x.position}}</td><td>{{x.department}}</td><td><a href="/admin/staff/{{x.id}}/edit">Edit</a> <form class="inline" method="post" action="/admin/staff/{{x.id}}/delete"><button class="danger">Delete</button></form></td></tr>{%endfor%}</table>{%endblock%}
