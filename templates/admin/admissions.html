{% extends 'admin/layout.html' %}{% block content %}<h1>Admissions</h1><p>Manage the admissions page from one place.</p>
<form class="form" method="post"><label>Page Title<input name="title" value="{{item.title or 'Admissions'}}"></label><label class="full">Introduction<textarea name="content">{{item.content or ''}}</textarea></label><label class="full">Requirements<textarea name="requirements">{{item.requirements or ''}}</textarea></label><label class="full">Application Steps<textarea name="application_steps">{{item.application_steps or ''}}</textarea></label><label class="full">Important Dates<textarea name="important_dates">{{item.important_dates or ''}}</textarea></label><label class="full">Admissions Contact<textarea name="contact">{{item.contact or ''}}</textarea></label><button class="btn">Save Admissions</button></form>{% endblock %}
