{%extends 'admin/layout.html'%}{%block content%}<h1>{{'Edit' if item else 'Add'}} News</h1><form class="form" method="post" enctype="multipart/form-data"><label>Title<input name="title" value="{{item.title if item else ''}}" required></label><label>Content<textarea name="content" required>{{item.content if item else ''}}</textarea></label><label>Image<input type="file" name="image" accept="image/*"></label><label><input type="checkbox" name="published" {%if not item or item.published%}checked{%endif%}> Publish</label><button class="btn">Save</button></form>{%endblock%}
