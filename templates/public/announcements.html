{% extends 'base.html' %}{% block title %}Announcements | {{school.school_name}}{% endblock %}{% block content %}<section class="page-hero"><div class="container"><h1>Announcements</h1></div></section><section class="section"><div class="container cards">{% for x in items %}<article class="card"><div class="card-body"><small>{{x.created_at.strftime('%d %b %Y')}}</small><h3>{{x.title}}</h3><p>{{x.content}}</p></div></article>{% else %}<p>No announcements published yet.</p>{% endfor %}</div></section>{% endblock %}
