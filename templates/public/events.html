{%extends 'base.html'%}{%block content%}<div class="page"><div class="container"><h1>School Events</h1></div></div><section class="section"><div class="container"><div class="cards">{%for e in events%}<article class="card">{%if e.image%}<img src="{{url_for('public.uploaded_file',filename=e.image)}}">{%endif%}<div><h2>{{e.title}}</h2><b>{{e.event_date.strftime('%d %B %Y, %I:%M %p') if e.event_date else 'Date to be announced'}}</b><p>{{e.description}}</p><p>{{e.location}}</p></div></article>{%else%}<p>No events added yet.</p>{%endfor%}</div></div></section>{%endblock%}
