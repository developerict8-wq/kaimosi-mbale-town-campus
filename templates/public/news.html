{%extends 'base.html'%}{%block content%}<div class="page"><div class="container"><h1>School News</h1></div></div><section class="section"><div class="container"><div class="cards">{%for n in news%}<article class="card">{%if n.image%}<img src="{{url_for('public.uploaded_file',filename=n.image)}}">{%endif%}<div><h2>{{n.title}}</h2><small>{{n.created_at.strftime('%d %B %Y')}}</small><p>{{n.content}}</p></div></article>{%else%}<p>No news published yet.</p>{%endfor%}</div></div></section>{%endblock%}
